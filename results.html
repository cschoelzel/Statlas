<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>statlas — Grundstücksregeln</title>
  <style>
    :root { --ink:#252525; --muted:#686868; --line:#e5e5e5; --accent:#e31b36; --soft:#f6f6f6; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font:14px/1.55 "Helvetica Neue",Arial,sans-serif; }
    button,input { font:inherit; } button,a,input { -webkit-tap-highlight-color:transparent; }
    a { color:inherit; } button { cursor:pointer; } button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    .topbar { height:88px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 max(32px,calc((100vw - 1240px)/2)); gap:24px; }
    .brand { color:var(--accent); display:flex; align-items:center; gap:10px; font-size:20px; font-weight:750; letter-spacing:-.7px; text-decoration:none; white-space:nowrap; }
    .brand-mark { color:var(--accent); font-size:28px; line-height:1; }
    .nav-back { border:1px solid var(--line); border-radius:30px; padding:11px 20px; text-decoration:none; font-weight:600; box-shadow:0 2px 7px #00000006; }
    .nav-back:hover { border-color:#b9b3af; } #lang-toggle { display:flex; gap:5px; } #lang-toggle button { background:white; border:0; border-radius:20px; padding:7px 9px; font-size:11px; font-weight:650; }
    .container { max-width:1240px; margin:0 auto; padding:44px 32px 64px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:30px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:1.7px; margin-bottom:9px; }
    h1 { font-size:34px; line-height:1.2; font-weight:650; letter-spacing:-1.1px; margin:0 0 9px; } #subtitle { color:var(--muted); }
    #as-of-badge { white-space:nowrap; font-size:12px; background:var(--soft); border-radius:25px; padding:9px 15px; margin-top:20px; }
    .property-overview { display:grid; grid-template-columns:1.08fr 1fr; gap:38px; margin-bottom:48px; padding:30px; border:1px solid var(--line); border-radius:20px; }
    .property-panel { padding:6px 0; } .property-panel h2,.section-title,.rules-heading { font-size:23px; letter-spacing:-.5px; font-weight:650; margin:0 0 18px; }
    .meta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:29px 20px; margin-top:27px; }
    .meta-label { color:var(--muted); font-size:13px; margin-bottom:4px; } .meta-value { font-size:18px; font-weight:600; word-break:break-word; }
    .map-panel { min-width:0; } .map-frame { height:330px; border-radius:14px; background:var(--soft); overflow:hidden; border:1px solid var(--line); }
    .map-frame iframe { width:100%; height:100%; border:0; } .map-note { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; color:var(--muted); font-size:11px; margin:10px 3px 0; } .map-note a { white-space:nowrap; color:var(--ink); font-weight:600; } .map-empty { height:100%; display:grid; place-content:center; padding:32px; text-align:center; color:var(--muted); }
    .rule-section { border-top:1px solid var(--line); padding-top:32px; } .section-description { color:var(--muted); margin:-10px 0 24px; }
    .controls { margin-bottom:26px; } .filter-group { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:36px; }
    .filter-btn { display:flex; flex-direction:column; gap:8px; text-align:left; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:12px; padding:22px 20px; font-size:13px; font-weight:550; min-height:117px; transition:border-color .15s,background .15s; } .filter-btn .status-number { font-size:30px; line-height:1; font-weight:650; letter-spacing:-1px; } .filter-btn:hover { border-color:var(--accent); } .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; } .filter-btn.active .status-number { color:#fff; }
    .search-filter { width:100%; max-width:390px; border:1px solid var(--line); border-radius:12px; padding:12px 15px; outline:none; background:var(--soft); } .search-filter:focus { border-color:var(--ink); background:white; }
    .rules-table-wrap { overflow-x:auto; border-top:1px solid var(--line); border-bottom:1px solid var(--line); scroll-margin-top:28px; } .rules-table { min-width:820px; font-size:14px; } .rules-table th { font-size:12px; padding:18px 22px; } .rules-table td { padding:25px 22px; } .rules-table tbody tr:last-child td { border-bottom:0; } .rule-topic { margin-top:40px; } .topic-heading { font-size:28px; font-weight:650; letter-spacing:-.7px; line-height:1.25; margin:0 0 20px; } #rules-overview { scroll-margin-top:28px; }
    .rule-title { font-size:15px; line-height:1.45; font-weight:650; margin:0 0 8px; } .rule-category { font-size:12px; color:var(--muted); } .rule-req { color:#454545; font-size:14px; line-height:1.6; } .rule-value { font-size:15px; font-weight:650; margin-top:12px; } .rule-location { font-size:12px; color:var(--muted); margin-top:5px; }
    .badge { display:inline-block; font-size:11px; line-height:1.6; font-weight:650; border-radius:6px; padding:6px 9px; white-space:nowrap; } .badge-applies { color:var(--accent); background:#fff; border:1px solid var(--accent); } .badge-unknown,.badge-future,.badge-other,.badge-superseded { background:#f0f0f0; color:#505050; }
    .questions-box { background:#f6f6f6; padding:13px 15px; border-radius:9px; color:#444; font-size:12px; margin-top:14px; } .questions-box strong { display:block; margin-bottom:5px; }
    .rule-source { font-size:12px; margin-top:13px; } .rule-source summary,.requirement-details summary { cursor:pointer; font-weight:600; color:#555; font-size:12px; } .rule-source-body { margin-top:12px; overflow-wrap:anywhere; } .source-link { font-size:13px; font-weight:650; text-underline-offset:4px; word-break:break-word; } blockquote { background:#f6f6f6; border-left:2px solid #ccc!important; padding:12px!important; border-radius:0 6px 6px 0; }
    .requirement-details { margin-top:10px; } .requirement-details p { font-size:13px; } .review-note { color:#555; font-size:12px; margin-top:12px; }
    .section-title { margin-top:42px; } table { width:100%; border-collapse:collapse; font-size:12px; } th { text-align:left; padding:12px 15px; background:var(--soft); font-weight:600; } td { border-bottom:1px solid var(--line); padding:15px; vertical-align:top; } .questions-table { overflow-x:auto; }
    .disclaimer { border-top:1px solid var(--line); padding-top:20px; font-size:11px; color:var(--muted); margin-top:32px; } .loading { padding:90px 24px; text-align:center; color:var(--muted); } .error { background:#fff4f1; padding:24px; border-radius:16px; margin:32px 0; } #conflict-banner { background:#f5f5f5; border-radius:12px; padding:14px 18px; font-size:12px; margin-bottom:20px; color:#444; } .no-rules { grid-column:1/-1; padding:40px; text-align:center; color:var(--muted); }
    @media(max-width:800px) { .topbar { padding:0 20px; height:76px; gap:12px; } .brand { font-size:17px; } .nav-back { padding:9px 12px; font-size:11px; } .container { padding:30px 20px; } h1 { font-size:28px; } header { flex-wrap:wrap; gap:8px; } #as-of-badge { margin-top:0; } .property-overview { grid-template-columns:1fr; gap:25px; padding:22px; } .filter-group { grid-template-columns:repeat(3,minmax(0,1fr)); } .filter-btn { min-height:105px; padding:17px; } .rules-list { grid-template-columns:1fr; } .meta-grid { gap:20px 12px; } .rule-card { padding:22px; } .map-frame { height:260px; } }
    @media(max-width:430px) { .brand { font-size:15px; gap:6px; } #lang-toggle { gap:0; } #lang-toggle button { padding:7px 5px; } .nav-back { font-size:10px; padding:8px; } .meta-grid { grid-template-columns:repeat(2,1fr); } .filter-group { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .filter-btn { font-size:12px; padding:16px; } .meta-value { font-size:16px; } }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="Main navigation">
    <a href="/" class="brand">statlas</a>
    <a href="/" class="nav-back"><span aria-hidden="true">← </span><span data-i18n="back">Back to search</span></a>
    <div id="lang-toggle"><button type="button" data-lang-btn="en" aria-label="English">EN</button><button type="button" data-lang-btn="de" aria-label="Deutsch">DE</button><button type="button" data-lang-btn="es" aria-label="Español">ES</button></div>
  </nav>
  <main class="container">
    <header>
      <div><h1 id="page-title">Your property</h1><div id="subtitle">Loading address details…</div></div>
      <div id="as-of-badge">As of: --</div>
    </header>
    <div id="loading-state" class="loading" role="status" data-i18n="loadingReport">Finding the rules for this address…</div>
    <div id="error-state" class="error" style="display:none" role="alert"></div>
    <div id="content-state" style="display:none">
      <section class="property-overview">
        <div class="property-panel"><h2 data-i18n="propertyDetails">A closer look at your property</h2><div class="meta-grid" id="meta-grid"></div></div>
        <div class="map-panel"><div class="map-frame" id="property-map"></div><div class="map-note"><span id="map-note"></span><a id="map-link" target="_blank" rel="noopener" style="display:none" data-i18n="openMap">Open map ↗</a></div></div>
      </section>
      <section class="rule-section"><h2 class="rules-heading" data-i18n="rulesHeading">The rules that matter here</h2>
      
      <div id="conflict-banner" style="display:none"></div>
      <div class="controls"><div class="filter-group" id="status-filters">
        <button class="filter-btn active" onclick="setStatusFilter('all',this)" aria-pressed="true"><span class="status-number" id="count-all">0</span><span data-i18n="fAll">all</span></button>
        <button class="filter-btn" onclick="setStatusFilter('applies',this)" aria-pressed="false"><span class="status-number" id="count-applies">0</span><span data-i18n="fApplies">applies</span></button>
        <button class="filter-btn" onclick="setStatusFilter('unknown',this)" aria-pressed="false"><span class="status-number" id="count-unknown">0</span><span data-i18n="fUnknown">unknown</span></button>
        <button class="filter-btn" onclick="setStatusFilter('superseded',this)" aria-pressed="false"><span class="status-number" id="count-other">0</span><span data-i18n="fSup">superseded</span></button>
        <button class="filter-btn" onclick="setStatusFilter('pending',this)" aria-pressed="false"><span class="status-number" id="count-pending">0</span><span data-i18n="fPending">pending</span></button>
      </div><input type="search" id="table-search" class="search-filter" data-i18n-ph="filterPh" placeholder="Search rules, categories or citations" aria-label="Filter rules" oninput="renderTable()"></div>
      <div id="rules-overview"></div></section>
      <section id="questions-section" style="display:none"><h2 class="section-title" data-i18n="openQ">Open questions for your property</h2><div class="questions-table"><table><thead><tr><th data-i18n="factHeader">Property detail</th><th data-i18n="questionHeader">Question</th><th data-i18n="affectedHeader">Affected rules</th></tr></thead><tbody id="questions-tbody"></tbody></table></div></section>
      <div style="font-size:11px;color:var(--muted);margin-top:26px" data-i18n="legalNoteRes">Legal texts shown in original (EN) only.</div><div class="disclaimer" id="disclaimer-box"></div>
    </div>
  </main>
  <script>
    let currentData = null;
    function humanizeFact(fact) { const names = {legal_city:t('metaJurisdiction'),units:t('metaUnits'),unit_count:t('metaUnits'),year_built:t('metaYear'),owner_type:t('metaType')}; return escapeHtml(names[fact] || t('propertyClarification')); }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function formatKeyValue(input) {
      let value = input;
      if (typeof value === 'string' && /^[{[]/.test(value.trim())) {
        try { value = JSON.parse(value); } catch { return '-'; }
      }
      if (value && typeof value === 'object') {
        if (value.value == null || value.error || Array.isArray(value)) return '-';
        const unit = String(value.unit || '').toLowerCase();
        const amount = Number(value.value);
        if (Number.isFinite(amount) && ['percent','percentage','%','usd','$','dollars','us_dollars'].includes(unit)) {
          const locale = typeof RHN_LANG === 'string' ? RHN_LANG : 'de';
          if (['percent','percentage','%'].includes(unit)) return new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(amount) + ' %';
          return new Intl.NumberFormat(locale,{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:2}).format(amount);
        }
        value = String(value.value) + (unit && !unit.includes('_') ? ' ' + unit : '');
      }
      if (value == null || value === '') return '-';
      const text = String(value);
      if (/^[a-z0-9]+(?:_[a-z0-9]+)+$/i.test(text)) return '-';
      return text;
    }
    function renderMap(geo) {
      const coords = geo.coordinates || {};
      const lat = Number(coords.y ?? coords.lat ?? coords.latitude);
      const lon = Number(coords.x ?? coords.lon ?? coords.longitude);
      const frame = document.getElementById('property-map');
      const link = document.getElementById('map-link');
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat)>90 || Math.abs(lon)>180) {
        frame.innerHTML = '<div class="map-empty">' + t('mapUnavailable') + '</div>';
        document.getElementById('map-note').textContent = t('mapNoCoordinates');
        link.style.display='none'; return;
      }
      const bbox = [lon-.004,lat-.0025,lon+.004,lat+.0025].join(',');
      const src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(bbox) + '&layer=mapnik&marker=' + lat + ',' + lon;
      if (frame.dataset.mapSrc !== src) { frame.innerHTML='<iframe title="OpenStreetMap property location" loading="lazy" referrerpolicy="no-referrer" src="' + src + '"></iframe>'; frame.dataset.mapSrc=src; }
      document.getElementById('map-note').textContent=t('mapCaution');
      link.href='https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=18/'+lat+'/'+lon;
      link.style.display='inline';
    }
    let currentStatusFilter = 'all';
    const urlParams = new URLSearchParams(window.location.search);
    let query = urlParams.get('q') || 'A0001';
    let asOf = urlParams.get('as_of') || '2026-10-01';
    let addressId = query.split(' ')[0].trim();
    fetch('/api/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address_id: addressId, as_of: asOf })
    })
    .then(async r => {
      if (!r.ok) {
        const err = await r.json().catch(() => ({ error: 'Netzwerkfehler' }));
        throw new Error(err.error || ('HTTP Fehler ' + r.status));
      }
      return r.json();
    })
    .then(data => { currentData = data; renderAll(); })
    .catch(() => fetch("data/" + encodeURIComponent(addressId) + ".json").then(r => {
      if (!r.ok) throw new Error("Static-Demo nicht gefunden");
      return r.json();
    }).then(data => { currentData = data; renderAll(); }))
    .catch(err => {
      document.getElementById('loading-state').style.display = 'none';
      const errBox = document.getElementById('error-state');
      errBox.style.display = 'block';
      let hint = '';
      if (window.location.protocol === 'file:') {
        hint = '<br><br>Diese Seite wurde direkt als Datei geoeffnet und kann den Server nicht erreichen. Bitte ueber den Server nutzen: <strong>http://127.0.0.1:8765</strong> (Start: <strong>python3 -m navigator.app serve</strong> im Projektordner).';
      } else if (err instanceof TypeError) {
        hint = '<br><br>Der Server antwortet nicht. Bitte starten: <strong>python3 -m navigator.app serve</strong> im Projektordner, dann http://127.0.0.1:8765 oeffnen.';
      }
      errBox.innerHTML = '<strong>Fehler bei der Abfrage:</strong> ' + escapeHtml(err.message) + hint + '<br><br><a href="/" style="color: #000000; font-weight: 600;">Zurück zur Suche</a>';
    });
    function setStatusFilter(status, el) {
      currentStatusFilter = status;
      document.querySelectorAll('#status-filters .filter-btn').forEach(btn => { btn.classList.remove('active'); btn.setAttribute('aria-pressed','false'); });
      if (el) { el.classList.add('active'); el.setAttribute('aria-pressed','true'); }
      renderTable();
      document.getElementById('rules-overview').scrollIntoView({behavior:'smooth',block:'start'});
    }
    function renderAll() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('content-state').style.display = 'block';
      const addr = currentData.address || {};
      const geo = currentData.geography || {};
      const decisions = currentData.decisions || [];
      renderMap(geo);
      const street = addr.street_address || addr.street || 'Address';
      const city = addr.postal_city || addr.city || '';
      document.getElementById('page-title').textContent = street;
      document.getElementById('subtitle').textContent = [city, addr.state, addr.zip].filter(Boolean).join(' · ') + ' · ' + (addr.address_id || addressId);
      document.getElementById('as-of-badge').textContent = (typeof t === 'function' ? t('asOf') : 'Stichtag: ') + currentData.as_of;
      const meta = [
        { label:t('metaJurisdiction'), val:geo.facts?.legal_city || geo.legal_city || geo.jurisdiction?.city || city || '—' },
        { label:t('metaUnits'), val:addr.units || '—' },
        { label:t('metaYear'), val:addr.year_built || '—' },
        { label:t('metaType'), val:addr.use_description || addr.owner_type || '—' },
        { label:t('metaState'), val:addr.state || '—' },
        { label:t('metaZip'), val:addr.zip || '—' }
      ];
      document.getElementById('meta-grid').innerHTML = meta.map(m => '<div class="meta-item"><div class="meta-label">' + escapeHtml(m.label) + '</div><div class="meta-value">' + escapeHtml(m.val) + '</div></div>').join('');
      const appliesCount = decisions.filter(d => d.result === 'applies').length;
      const unknownCount = decisions.filter(d => d.result === 'unknown').length;
      const pendingCount = decisions.filter(d => ['pending', 'not_yet_effective', 'future_effective'].includes(d.result)).length;
      const supersededCount = decisions.filter(d => ['superseded', 'not_applicable', 'repealed_or_expired', 'does_not_apply', 'failed'].includes(d.result)).length;
      document.getElementById('count-all').textContent = decisions.length;
      document.getElementById('count-applies').textContent = appliesCount;
      document.getElementById('count-unknown').textContent = unknownCount;
      document.getElementById('count-other').textContent = supersededCount;
      document.getElementById('count-pending').textContent = pendingCount;
      const questions = currentData.questions || [];
      if (questions.length > 0) {
        document.getElementById('questions-section').style.display = 'block';
        document.getElementById('questions-tbody').innerHTML = questions.map(q => '<tr><td><strong>' + humanizeFact(q.fact) + '</strong></td><td>' + escapeHtml(q.question || q.prompt || '-') + (q.why_needed ? '<div class="rule-location">' + escapeHtml(q.why_needed) + '</div>' : '') + (q.acceptable_evidence ? '<div class="rule-location">Nachweis: ' + escapeHtml(Array.isArray(q.acceptable_evidence) ? q.acceptable_evidence.join('; ') : q.acceptable_evidence) + '</div>' : '') + (q.research_task ? '<div class="rule-location">Research-Task (keine Nutzerantwort noetig)</div>' : '') + '</td><td>' + escapeHtml((q.citations || []).filter(Boolean).join(', ') || ((q.rule_ids || []).length + ' ' + t('ruleCountLabel'))) + '</td></tr>').join('');
      }
      document.getElementById('disclaimer-box').textContent = currentData.disclaimer || 'Not legal advice.';
      renderTable();
    }
    function afterLangChange() { if (currentData) { renderAll(); } }
    function renderTable() {
      const decisions = currentData.decisions || [];
      const filterText = (document.getElementById('table-search').value || '').toLowerCase();
      const filtered = decisions.filter(d => {
        if (currentStatusFilter === 'applies' && d.result !== 'applies') return false;
        if (currentStatusFilter === 'unknown' && d.result !== 'unknown') return false;
        if (currentStatusFilter === 'pending' && !['pending', 'not_yet_effective', 'future_effective'].includes(d.result)) return false;
        if (currentStatusFilter === 'superseded' && !['superseded', 'not_applicable', 'repealed_or_expired', 'does_not_apply', 'failed'].includes(d.result)) return false;
        if (!filterText) return true;
        const rule = d.rule || {};
        const haystack = [d.result, rule.title, rule.requirement, rule.category, rule.jurisdiction, rule.level, rule.citation, rule.key_value, d.computed_value, rule.source_doc_id].join(' ').toLowerCase();
        return haystack.includes(filterText);
      });
      const statusMap = {
        'applies': { label: 'GILT', cls: 'badge-applies' },
        'unknown': { label: 'UNKLAR', cls: 'badge-unknown' },
        'superseded': { label: 'VERDRÄNGT', cls: 'badge-superseded' },
        'future_effective': { label: 'ZUKÜNFTIG', cls: 'badge-future' },
        'pending': { label: 'ANHÄNGIG', cls: 'badge-future' },
        'not_yet_effective': { label: 'NOCH NICHT IN KRAFT', cls: 'badge-future' },
        'does_not_apply': { label: 'GREIFT NICHT', cls: 'badge-other' },
        'failed': { label: 'GESCHEITERT', cls: 'badge-other' },
        'repealed_or_expired': { label: 'AUFGEHOBEN', cls: 'badge-other' },
        'not_applicable': { label: 'NICHT ANWENDBAR', cls: 'badge-other' }
      };
      const categoryMap = {
        'rent_increase_cap': 'Mietobergrenze',
        'just_cause_eviction': 'Kündigungsschutz',
        'security_deposit': 'Kaution',
        'notice_period': 'Kündigungsfrist',
        'lease_renewal': 'Vertragsverlängerung',
        'algorithmic_devices': 'Preissetzungs-Algorithmen',
        'code_compliance': 'Wohnungsstandards',
        'retaliation_protection': 'Schutz vor Vergeltung',
        'screening_restrictions': 'Bewerbungsprüfung',
        'application_screening_fees': 'Bewerbungsgebühren',
        'security_deposits': 'Kaution',
        'algorithmic_rent_setting': 'Algorithmische Mietfestlegung'
      };
      const tbody = document.getElementById('rules-overview');
      if (filtered.length === 0) {
        tbody.innerHTML = '<div class="no-rules">' + (typeof t === 'function' ? t('emptyMsg') : 'Keine Vorschriften für diese Filterauswahl gefunden.') + '</div>';
        return;
      }
      const allDec = currentData.decisions || currentData.rules || filtered;
      const conflicts = allDec.filter(function(x) { return x.conflict_flag; });
      const cb = document.getElementById('conflict-banner');
      if (cb) {
        if (conflicts.length > 0) { cb.style.display = 'block'; cb.textContent = conflicts.length + (typeof t === 'function' ? t('conflictSuffix') : ' Entscheidung(en) mit Konflikt-Flag: moegliche Normenkollision, menschliche Pruefung noetig.'); }
        else { cb.style.display = 'none'; }
      }
      const renderRow = d => {
        const rule = d.rule || {};
        const sInfo = statusMap[d.result] || { label: t('fUnknown'), cls: 'badge-other' };
        const catLabel = categoryMap[rule.category] || (rule.category ? rule.category.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()) : '—');
