<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Finde die Mietregeln für eine Immobilie. Adresse suchen, Vorschlag auswählen und belegte Regeln ansehen.">
<title>statlas — Suche</title>
<style>
:root{color-scheme:light;--ink:#222;--muted:#717171;--line:#ddd;--accent:#e31b36}
*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}
header{height:96px;padding:0 6%;display:flex;align-items:center;justify-content:space-between}.brand{text-decoration:none;color:var(--accent);font-size:24px;font-weight:650;letter-spacing:-.8px}.languages{display:flex;gap:2px}.languages button{border:0;background:white;border-radius:20px;padding:9px 11px;font-size:12px;color:var(--muted)}.languages button.active{color:var(--accent);font-weight:650}.languages button:hover{text-decoration:underline}
main{min-height:calc(100dvh - 96px);display:grid;place-items:center;padding:24px 24px 150px}.search-container{width:min(850px,100%);position:relative}.search-bar{display:flex;align-items:center;position:relative;border:1px solid var(--line);border-radius:44px;padding:8px 9px 8px 0;background:white;box-shadow:0 8px 30px #2222220d;z-index:2}.search-bar:focus-within{border-color:#aaa}.address-field{flex:1;min-width:0;padding:13px 32px}.field-label{display:block;font-size:12px;font-weight:650;margin-bottom:7px}.address-field input{width:100%;outline:none;border:0;padding:0;background:white;font-size:15px;color:var(--ink);text-overflow:ellipsis}.address-field input::placeholder{color:var(--muted)}.date-field{position:relative;width:205px;flex-shrink:0;padding:7px 26px;border-left:1px solid var(--line)}.date-value{line-height:20px;white-space:nowrap}.date-value svg{display:block}.submit{border:0;width:54px;height:54px;flex-shrink:0;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;transition:transform .15s}.submit:hover{box-shadow:0 0 0 3px white,0 0 0 4px var(--accent)}.submit:active{transform:scale(.96)}.submit svg{width:19px;height:19px}
.search-bar:has(#q[aria-expanded=true]){border-radius:32px 32px 0 0;border-bottom-color:transparent;box-shadow:0 8px 30px #2222220a}.suggestions{position:absolute;top:calc(100% - 1px);left:-1px;width:calc(100% + 2px);padding:12px 20px 16px;background:white;border:1px solid var(--line);border-top:0;border-radius:0 0 32px 32px;box-shadow:0 20px 28px #2222220a;z-index:3;max-height:min(390px,45dvh);overflow:auto;scrollbar-width:thin;scrollbar-color:#ddd transparent}.search-bar:focus-within .suggestions{border-color:#aaa}.suggestion-heading{font-size:11px;color:var(--muted);font-weight:600;margin:0 12px 12px}.option{display:flex;align-items:center;gap:15px;width:100%;border:0;border-radius:10px;padding:12px;background:white;text-align:left;color:var(--ink)}.option:hover,.option[aria-selected=true]{outline:1px solid var(--line);outline-offset:-1px}.pin{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px}.pin svg{width:20px;height:20px}.option-text{min-width:0}.option strong{display:block;font-size:14px;font-weight:550;line-height:1.45}.option small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}.empty{padding:8px 12px 16px;font-size:13px;line-height:1.6;color:var(--muted)}.message{font-size:13px;color:var(--accent);margin:16px 28px;line-height:1.5}
.date-trigger{border:0;background:transparent;text-align:left;width:100%;padding:0;color:var(--ink)}.date-value{display:flex;align-items:center;justify-content:flex-start;gap:10px;font-size:14px;color:var(--muted)}.date-value svg{order:-1;width:18px;height:18px;flex-shrink:0;color:var(--ink)}.date-field:has(.date-trigger[aria-expanded=true]){background:white;border-radius:35px}.calendar{position:absolute;top:calc(100% + 22px);right:-64px;width:340px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 50px #22222218;z-index:4;animation:reveal .18s ease-out}.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:8px}.month-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:white;font-size:24px;line-height:1}.month-nav:hover{background:white}.month-selectors{display:flex;align-items:center;justify-content:center;gap:7px}.month-selectors select,.month-selectors input{background:white;border:0;color:var(--ink);font-size:14px;font-weight:600;padding:5px;outline-offset:3px}.month-selectors input{width:68px}.weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays{font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px}.calendar-days button{height:38px;border:0;border-radius:50%;background:white;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}.calendar-days button:hover{background:white;box-shadow:inset 0 0 0 1px var(--ink)}.calendar-days button.selected{background:var(--accent);color:white}.calendar-days button.today{box-shadow:inset 0 0 0 1px var(--ink)}.calendar-footer{border-top:1px solid var(--line);margin-top:18px;padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.calendar-footer button{background:white;border:0;color:var(--ink);text-decoration:underline;font-size:12px;font-weight:600;padding:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){header{height:80px;padding:0 24px}.brand{font-size:22px}.languages button{padding:8px}main{min-height:calc(100dvh - 80px);padding:24px 20px 120px}.search-bar{padding:7px 7px 7px 0}.address-field{padding:14px 16px}.address-field input{font-size:13px}.field-label{font-size:11px}.date-field{width:130px;padding:7px 12px}.date-value{font-size:12px;gap:7px}.date-value svg{width:15px;height:15px}.suggestions{padding:12px 10px}.option{gap:11px}.option strong{font-size:13px;overflow-wrap:anywhere}.calendar{position:fixed;top:auto;bottom:20px;left:20px;right:20px;width:auto}}
@media(max-width:400px){.date-field{width:115px;padding:7px 8px}.date-value{gap:5px}.submit{width:46px;height:46px}.address-field{padding-left:14px;padding-right:8px}.address-field input{font-size:12px}.field-label{line-height:1.4}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
<a class="brand" href="/" aria-label="statlas">statlas</a>
<nav class="languages" aria-label="Sprache"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></nav>
</header>
<main>
<section class="search-container" aria-label="Immobiliensuche">
<form class="search-bar" action="/results" method="get" id="search-form">
<div class="address-field"><label class="field-label" for="q" id="address-label">Wo liegt die Immobilie?</label><input id="q" type="text" placeholder="Adresse oder Stadt suchen" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggestions-list" aria-expanded="false" aria-describedby="search-message" required><input type="hidden" name="q" id="selected-id"></div>
<div class="date-field"><button type="button" class="date-trigger" id="date-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendar"><span class="field-label" id="date-label">Regeln zum</span><span class="date-value"><span id="date-display">01.10.2026</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v4m8-4v4M4 10h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button><input type="hidden" name="as_of" id="as_of" value="2026-10-01"><div class="calendar" id="calendar" role="dialog" aria-labelledby="calendar-title" hidden><div class="calendar-header"><button type="button" class="month-nav" id="month-prev">‹</button><div class="month-selectors"><select id="calendar-month"></select><input type="number" id="calendar-year" min="1900" max="2100" value="2026"></div><button type="button" class="month-nav" id="month-next">›</button></div><h2 id="calendar-title" class="sr-only"></h2><div class="weekdays" id="calendar-weekdays" aria-hidden="true"></div><div class="calendar-days" id="calendar-days"></div><div class="calendar-footer"><button type="button" id="calendar-today">Heute</button><span id="calendar-hint">Stichtag auswählen</span></div></div></div>
<button class="submit" type="submit" aria-label="Suchen"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<div class="suggestions" id="suggestions" hidden><p class="suggestion-heading" id="suggestion-heading">Adressen entdecken</p><div role="listbox" id="suggestions-list" aria-label="Adressvorschläge"></div><div class="empty" id="empty-message" role="status" hidden></div></div>
</form>
<p class="message" id="search-message" role="status" hidden></p>
</section>
</main>
<script>
const copy={de:{address:'Wo liegt die Immobilie?',placeholder:'Adresse oder Stadt suchen',date:'Regeln zum',search:'Suchen',discover:'Adressen entdecken',matches:'Passende Adressen',empty:'Keine passende Adresse gefunden. Suche nach einer anderen Straße, Stadt oder Adress-ID.',choose:'Wähle eine Adresse aus den Vorschlägen aus.',loading:'Adressen werden geladen …',error:'Die Adressen konnten nicht geladen werden. Bitte lade die Seite erneut.'},en:{address:'Where is the property?',placeholder:'Search an address or city',date:'Rules as of',search:'Search',discover:'Explore addresses',matches:'Matching addresses',empty:'No matching address. Try another street, city or address ID.',choose:'Choose an address from the suggestions.',loading:'Loading addresses …',error:'Could not load addresses. Please reload this page.'},es:{address:'¿Dónde está el inmueble?',placeholder:'Buscar dirección o ciudad',date:'Normas al',search:'Buscar',discover:'Explorar direcciones',matches:'Direcciones coincidentes',empty:'No hay coincidencias. Busca otra calle, ciudad o ID.',choose:'Selecciona una dirección de las sugerencias.',loading:'Cargando direcciones …',error:'No se pudieron cargar las direcciones. Recarga la página.'}};
function readLanguage(){try{return localStorage.getItem('rhn-lang')||'de'}catch(e){return 'de'}}
let lang=readLanguage();if(!copy[lang])lang='de';
const input=document.getElementById('q'),panel=document.getElementById('suggestions'),list=document.getElementById('suggestions-list'),empty=document.getElementById('empty-message'),message=document.getElementById('search-message'),selectedId=document.getElementById('selected-id');
let addresses=[],matches=[],selected=null,active=-1,loaded=false,failed=false;
const text=()=>copy[lang];
function setLanguage(value){lang=value;try{localStorage.setItem('rhn-lang',lang)}catch(e){};document.documentElement.lang=lang;document.getElementById('address-label').textContent=text().address;input.placeholder=text().placeholder;document.getElementById('date-label').textContent=text().date;document.querySelector('.submit').setAttribute('aria-label',text().search);document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});if(!panel.hidden)renderSuggestions();updateDateDisplay();if(!calendar.hidden)renderCalendar()}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
const pin='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>';
function closeSuggestions(){matches=[];panel.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');active=-1}
function pick(address){selected=address;selectedId.value=address.id;input.value=address.label;message.hidden=true;closeSuggestions();input.focus();closeSuggestions()}
function renderSuggestions(){const query=input.value.trim().toLowerCase();if(!query||selected){closeSuggestions();return}closeCalendar();matches=addresses.filter(a=>a.search.includes(query)).slice(0,5);active=-1;input.removeAttribute('aria-activedescendant');list.replaceChildren();document.getElementById('suggestion-heading').textContent=query?text().matches:text().discover;matches.forEach((a,i)=>{const button=document.createElement('button');button.type='button';button.className='option';button.id='address-option-'+i;button.setAttribute('role','option');button.setAttribute('aria-selected','false');button.tabIndex=-1;const icon=document.createElement('span');icon.className='pin';icon.innerHTML=pin;const content=document.createElement('span');content.className='option-text';const title=document.createElement('strong');title.textContent=a.primary;const subtitle=document.createElement('small');subtitle.textContent=a.secondary;content.append(title,subtitle);button.append(icon,content);button.addEventListener('click',()=>pick(a));list.append(button)});empty.hidden=matches.length>0;empty.textContent=failed?text().error:loaded?text().empty:text().loading;panel.hidden=false;input.setAttribute('aria-expanded','true')}
input.addEventListener('focus',renderSuggestions);input.addEventListener('click',renderSuggestions);input.addEventListener('input',()=>{selected=null;selectedId.value='';message.hidden=true;renderSuggestions()});
input.addEventListener('keydown',event=>{if(event.key==='Escape'){closeSuggestions();return}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(panel.hidden)renderSuggestions();if(!matches.length)return;active=active<0?(event.key==='ArrowDown'?0:matches.length-1):(active+(event.key==='ArrowDown'?1:-1)+matches.length)%matches.length;Array.from(list.children).forEach((b,i)=>b.setAttribute('aria-selected',i===active));input.setAttribute('aria-activedescendant','address-option-'+active)}else if(event.key==='Enter'&&!panel.hidden&&active>=0){event.preventDefault();pick(matches[active])}});
document.addEventListener('click',event=>{if(!event.target.closest('.address-field')&&!event.target.closest('#suggestions'))closeSuggestions();if(!event.target.closest('.date-field'))closeCalendar()});document.getElementById('search-form').addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement.closest('.address-field')&&!document.activeElement.closest('#suggestions'))closeSuggestions();if(!document.activeElement.closest('.date-field'))closeCalendar()},0));
document.getElementById('search-form').addEventListener('submit',event=>{if(!selected){const q=input.value.trim().toLowerCase();const exact=addresses.find(a=>a.id.toLowerCase()===q||a.label.toLowerCase()===q);if(exact){selected=exact;selectedId.value=exact.id}else{event.preventDefault();message.textContent=text().choose;message.hidden=false;input.focus();renderSuggestions()}}});
function load(items){addresses=items.map(a=>{const id=a.address_id||a.id;const primary=a.street_address||(a.label||'').split(',')[0];const secondary=a.street_address?[a.postal_city||a.city,a.state,a.zip].filter(Boolean).join(', '):(a.label||'').split(',').slice(1).join(',').trim();const label=primary+(secondary?', '+secondary:'');return{id,primary,secondary,label,search:(id+' '+label).toLowerCase()}});loaded=true;if(document.activeElement===input)renderSuggestions()}
fetch('/api/addresses').then(r=>{if(!r.ok)throw Error('addresses');return r.json()}).then(data=>load(data.addresses||[])).catch(()=>fetch('addresses.json').then(r=>{if(!r.ok)throw Error('addresses');return r.json()}).then(data=>load(Array.isArray(data)?data:data.addresses||[])).catch(()=>{failed=true;if(document.activeElement===input)renderSuggestions()}));
const calendar=document.getElementById('calendar'),dateTrigger=document.getElementById('date-trigger'),dateInput=document.getElementById('as_of'),monthSelect=document.getElementById('calendar-month'),yearInput=document.getElementById('calendar-year'),dayGrid=document.getElementById('calendar-days');
let calendarMonth=new Date(dateInput.value+'T12:00:00');calendarMonth.setDate(1);
const calendarCopy={de:{prev:'Vorheriger Monat',next:'Nächster Monat',month:'Monat',year:'Jahr',today:'Heute',hint:'Stichtag auswählen'},en:{prev:'Previous month',next:'Next month',month:'Month',year:'Year',today:'Today',hint:'Choose a date'},es:{prev:'Mes anterior',next:'Mes siguiente',month:'Mes',year:'Año',today:'Hoy',hint:'Selecciona una fecha'}};
function isoDate(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function updateDateDisplay(){document.getElementById('date-display').textContent=new Intl.DateTimeFormat(lang,{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(dateInput.value+'T12:00:00'));dateTrigger.setAttribute('aria-label',text().date+': '+document.getElementById('date-display').textContent)}
function closeCalendar(){calendar.hidden=true;dateTrigger.setAttribute('aria-expanded','false')}
function chooseDate(value){dateInput.value=value;updateDateDisplay();closeCalendar();dateTrigger.focus()}
function renderCalendar(){const labels=calendarCopy[lang];document.getElementById('month-prev').setAttribute('aria-label',labels.prev);document.getElementById('month-next').setAttribute('aria-label',labels.next);monthSelect.setAttribute('aria-label',labels.month);yearInput.setAttribute('aria-label',labels.year);document.getElementById('calendar-today').textContent=labels.today;document.getElementById('calendar-hint').textContent=labels.hint;document.getElementById('calendar-title').textContent=new Intl.DateTimeFormat(lang,{month:'long',year:'numeric'}).format(calendarMonth);monthSelect.replaceChildren();for(let m=0;m<12;m++){const option=document.createElement('option');option.value=m;option.textContent=new Intl.DateTimeFormat(lang,{month:'long'}).format(new Date(2026,m,1));monthSelect.append(option)}monthSelect.value=calendarMonth.getMonth();yearInput.value=calendarMonth.getFullYear();const weekdays=document.getElementById('calendar-weekdays');weekdays.replaceChildren();for(let i=0;i<7;i++){const label=document.createElement('span');label.textContent=new Intl.DateTimeFormat(lang,{weekday:'short'}).format(new Date(2026,9,5+i));weekdays.append(label)}dayGrid.replaceChildren();const offset=(calendarMonth.getDay()+6)%7;for(let i=0;i<offset;i++)dayGrid.append(document.createElement('span'));const total=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();for(let d=1;d<=total;d++){const date=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),d);const value=isoDate(date),button=document.createElement('button');button.type='button';button.textContent=d;button.dataset.date=value;button.classList.toggle('selected',value===dateInput.value);button.classList.toggle('today',value===isoDate(new Date()));button.setAttribute('aria-pressed',value===dateInput.value);button.setAttribute('aria-label',new Intl.DateTimeFormat(lang,{dateStyle:'full'}).format(date));button.addEventListener('click',()=>chooseDate(value));dayGrid.append(button)}}
dateTrigger.addEventListener('click',()=>{if(!calendar.hidden){closeCalendar();return}closeSuggestions();calendarMonth=new Date(dateInput.value+'T12:00:00');calendarMonth.setDate(1);renderCalendar();calendar.hidden=false;dateTrigger.setAttribute('aria-expanded','true');dayGrid.querySelector('.selected').focus()});
function moveMonth(delta){const next=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+delta,1);if(next.getFullYear()<1900||next.getFullYear()>2100)return;calendarMonth=next;renderCalendar()}
document.getElementById('month-prev').addEventListener('click',()=>moveMonth(-1));document.getElementById('month-next').addEventListener('click',()=>moveMonth(1));monthSelect.addEventListener('change',()=>{calendarMonth.setMonth(Number(monthSelect.value));renderCalendar()});yearInput.addEventListener('change',()=>{const year=Number(yearInput.value);if(Number.isInteger(year)&&year>=1900&&year<=2100){calendarMonth.setFullYear(year);renderCalendar()}else yearInput.value=calendarMonth.getFullYear()});document.getElementById('calendar-today').addEventListener('click',()=>chooseDate(isoDate(new Date())));
calendar.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();closeCalendar();dateTrigger.focus();return}if(!event.target.dataset.date)return;const shifts={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};if(!(event.key in shifts))return;event.preventDefault();const date=new Date(event.target.dataset.date+'T12:00:00');date.setDate(date.getDate()+shifts[event.key]);if(date.getFullYear()<1900||date.getFullYear()>2100)return;calendarMonth=new Date(date.getFullYear(),date.getMonth(),1);renderCalendar();dayGrid.querySelector('[data-date="'+isoDate(date)+'"]').focus()});
setLanguage(lang);

</script>
</body>
</html>
